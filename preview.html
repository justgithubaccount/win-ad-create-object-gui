<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создание пользователя AD — локальный просмотр</title>
  <style>
    :root { font: 16px system-ui, sans-serif; color: #1d2939; background: #f3f6fa; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    .note { color: #475467; margin: 0 0 1.5rem; }
    form { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 12px #1d293914; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.5rem; }
    label { display: grid; gap: .35rem; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; padding: .65rem; border: 1px solid #98a2b3; border-radius: 6px; font: inherit; }
    input:focus, select:focus { outline: 2px solid #2767ad; outline-offset: 1px; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    button { padding: .7rem 1rem; border: 0; border-radius: 6px; background: #175cd3; color: white; font: inherit; cursor: pointer; }
    button.secondary { background: #344054; }
    #result { white-space: pre-wrap; background: #eaf2ff; padding: 1rem; border-radius: 6px; margin-top: 1rem; }
    @media (max-width: 680px) { .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Создание пользователя AD</h1>
  <p class="note">Локальный просмотр формы для Linux и других систем. Данные остаются в браузере; эта страница не обращается к AD и не создаёт пользователя.</p>
  <form id="user-form">
    <div class="fields">
      <label>Фамилия <input id="surname" autocomplete="off" required></label>
      <label>Имя <input id="given-name" autocomplete="off" required></label>
      <label>Выводимое имя <input id="display-name" readonly></label>
      <label>Логин <input id="login" autocomplete="off" required></label>
      <label>Пароль <input id="password" type="password" autocomplete="new-password" required></label>
      <label>Тип учётной записи
        <select id="account-type">
          <option value="">Выберите тип</option>
          <option>Администратор</option><option>Консультант</option><option>Подрядчик</option>
          <option>Сотрудник</option><option>Аудитор</option>
        </select>
      </label>
      <label>Компания <input id="company"></label>
      <label>Отдел <input id="department"></label>
      <label>Должность <input id="title"></label>
      <label>Email <input id="mail" type="email"></label>
      <label>Телефон <input id="phone"></label>
      <label>Описание <input id="description"></label>
      <label>Страна <input id="country"></label>
      <label>Область <input id="state"></label>
      <label>Город <input id="city"></label>
      <label>Комната <input id="office"></label>
      <label>Ролевая группа <input id="role" placeholder="Без подключения к AD — введите вручную"></label>
      <label>Руководитель <input id="manager" placeholder="Без подключения к AD — введите вручную"></label>
    </div>
    <div class="actions">
      <button type="button" id="generate-login" class="secondary">Сформировать логин</button>
      <button type="submit">Предварительный просмотр</button>
    </div>
    <div id="result" role="status" hidden></div>
  </form>
  <script>
    const byId = (id) => document.getElementById(id);
    const defaults = {
      'Администратор': ['ИТ', 'Администратор'],
      'Консультант': ['Консалтинг', 'Консультант'],
      'Подрядчик': ['Подряд', 'Подрядчик'],
      'Сотрудник': ['Сотрудники', 'Сотрудник'],
      'Аудитор': ['Аудит', 'Аудитор']
    };
    const ru = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';
    const en = ['a','b','v','g','d','e','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','kh','ts','ch','sh','sch','','y','','e','yu','ya'];
    function updateDisplayName() {
      byId('display-name').value = [byId('surname').value.trim(), byId('given-name').value.trim()].filter(Boolean).join(' ');
    }
    for (const id of ['surname', 'given-name']) byId(id).addEventListener('input', updateDisplayName);
    byId('generate-login').addEventListener('click', () => {
      const first = byId('given-name').value.trim();
      const last = byId('surname').value.trim();
      if (!first || !last) { byId('login').value = ''; return; }
      const name = (first[0] + last).toLowerCase();
      byId('login').value = [...name].map(char => {
        const index = ru.indexOf(char);
        return index < 0 ? char : en[index];
      }).join('').replace(/\s+/g, '');
    });
    byId('account-type').addEventListener('change', () => {
      const values = defaults[byId('account-type').value];
      if (values) [byId('department').value, byId('title').value] = values;
    });
    byId('user-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const result = byId('result');
      result.textContent = [
        ['Имя', 'display-name'], ['Логин', 'login'], ['Тип', 'account-type'],
        ['Компания', 'company'], ['Отдел', 'department'], ['Должность', 'title'],
        ['Email', 'mail'], ['Телефон', 'phone'], ['Описание', 'description'],
        ['Страна', 'country'], ['Область', 'state'], ['Город', 'city'],
        ['Комната', 'office'], ['Ролевая группа', 'role'], ['Руководитель', 'manager']
      ].map(([label, id]) => `${label}: ${byId(id).value}`).join('\n');
      result.hidden = false;
    });
  </script>
</body>
</html>
